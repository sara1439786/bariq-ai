<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BariqAI App Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 360px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 30px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 32px;
    }

    p {
      color: #555;
      margin-bottom: 24px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>BariqAI</h1>
    <p>AI videos + influencer marketplace for businesses</p>

    <a class="btn primary" href="business-dashboard.html">Continue as Business</a>
    <a class="btn secondary" href="creator-dashboard.html">Continue as Influencer</a>
    <a class="btn primary" href="login.html">Login</a>
    <a class="btn secondary" href="signup.html">Sign Up</a>
  </div>
</body>
</html>
