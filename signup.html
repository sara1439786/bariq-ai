<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - BariqAI</title>
</head>
<body>
  <div style="max-width:420px;margin:60px auto;padding:20px;">
    <h2>Create BariqAI Account</h2>
    <input id="email" type="email" placeholder="Email" style="width:100%;padding:12px;margin:10px 0;">
    <input id="password" type="password" placeholder="Password" style="width:100%;padding:12px;margin:10px 0;">
    <button id="signupBtn" style="width:100%;padding:12px;">Sign Up</button>
    <p id="message"></p>
    <p><a href="login.html">Already have an account? Login</a></p>
  </div>

  <script type="module">
    import { supabase } from './supabase.js'

    const signupBtn = document.getElementById('signupBtn')
    const message = document.getElementById('message')

    signupBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value.trim()

      if (!email || !password) {
        message.textContent = 'Please enter email and password.'
        return
      }

      const { data, error } = await supabase.auth.signUp({
        email,
        password
      })

      if (error) {
        message.textContent = error.message
      } else {
        message.textContent = 'Signup successful. Now go to login.'
        setTimeout(() => {
          window.location.href = 'login.html'
        }, 1500)
      }
    })
  </script>
</body>
</html>
