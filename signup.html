<!DOCTYPE html>
<html>
<head>
<title>Create BariqAI Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Arial;
text-align:center;
margin-top:120px;
}
input{
display:block;
margin:10px auto;
padding:10px;
width:260px;
}
button{
padding:10px 20px;
cursor:pointer;
}
</style>

</head>

<body>

<h2>Create BariqAI Account</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="signup()">Sign Up</button>

<br><br>
<a href="login.html">Already have account? Login</a>

<script>

const supabaseUrl = https://bariq-ai-three.vercel.app
const supabaseKey = ""sb_publishable_npll8QpLghinRC6gMO4_wA_ZgM-ogRd

const { createClient } = supabase
const supabaseClient = createClient(supabaseUrl, supabaseKey)

async function signup(){

const email = document.getElementById("email").value
const password = document.getElementById("password").value

const { data, error } = await supabaseClient.auth.signUp({
email: email,
password: password
})

if(error){
alert(error.message)
return
}

alert("Signup successful")
window.location.href="login.html"

}

</script>

</body>
</html>
