<!DOCTYPE html>
<html>
<head>
<title>BariqAI Influencer Marketplace</title>

<style>

body{
font-family: Arial;
background:#f6f3ff;
padding:30px;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
color:#3d2b7a;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:30px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

.button{
background:linear-gradient(45deg,#6a4df5,#b86cff);
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>BariqAI Influencer Marketplace</h1>

<p>Discover premium creators for your campaigns</p>

<div class="grid">

<div class="card">
<h3>Beauty Creator</h3>
<p>Followers: 120K</p>
<p>Location: Hyderabad</p>
<button class="button">Hire Creator</button>
</div>

<div class="card">
<h3>Fashion Creator</h3>
<p>Followers: 80K</p>
<p>Location: Mumbai</p>
<button class="button">Hire Creator</button>
</div>

<div class="card">
<h3>Luxury Lifestyle</h3>
<p>Followers: 210K</p>
<p>Location: Dubai</p>
<button class="button">Hire Creator</button>
</div>

</div>

</div>

</body>
</html>
