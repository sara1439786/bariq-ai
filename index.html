<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - BariqAI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div style="max-width: 420px; margin: 60px auto; padding: 20px;">
    <h2>Login to BariqAI</h2>
    <input id="email" type="email" placeholder="Email" style="width:100%;padding:12px;margin:10px 0;" />
    <input id="password" type="password" placeholder="Password" style="width:100%;padding:12px;margin:10px 0;" />
    <button id="loginBtn" style="width:100%;padding:12px;">Login</button>
    <p id="message" style="margin-top:12px;"></p>
    <p style="margin-top:16px;">
      Don’t have an account? <a href="signup.html">Sign up</a>
    </p>
  </div>

  <script type="module">
    import { supabase } from './supabase.js'

    const loginBtn = document.getElementById('loginBtn')
    const message = document.getElementById('message')

    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value.trim()

      if (!email || !password) {
        message.textContent = 'Please enter email and password.'
        return
      }

      message.textContent = 'Logging in...'

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      })

      if (error) {
        message.textContent = error.message
        return
      }

      message.textContent = 'Login successful!'
      window.location.href = 'business-dashboard.html'
    })
  </script>
</body>
</html>
<a href="login.html">Login</a>
<a href="signup.html">Sign Up</a>
