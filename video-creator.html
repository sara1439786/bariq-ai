<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bariq Test 777</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf7ff;
      padding: 40px;
    }
    .box {
      max-width: 700px;
      margin: auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
    }
    button {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: purple;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      font-size: 22px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bariq Test 777</h1>
    <p>If this works, the button will change the text below.</p>
    <button type="button" onclick="runTest()">Click Me</button>
    <div id="status">NOT CLICKED</div>
  </div>

  <script>
    function runTest() {
      document.getElementById("status").textContent = "BUTTON WORKING";
      alert("JavaScript is working");
    }
  </script>
</body>
</html>
