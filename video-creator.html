<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bariq AI Video Creator</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #faf7ff 0%, #fff9ef 50%, #f8f2ff 100%);
      color: #241f31;
      padding: 24px;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }
    .box {
      background: #fff;
      border: 1px solid #f1df9f;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(78, 38, 112, 0.08);
      margin-bottom: 20px;
    }
    h1, h2, h3 {
      margin-top: 0;
      color: #5f2396;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .full { grid-column: 1 / -1; }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .primary {
      background: linear-gradient(135deg, #5f2396 0%, #8a3ffc 60%, #d4af37 130%);
      color: white;
    }
    .light {
      background: #f6eeff;
      color: #5f2396;
      border: 1px solid #e7d7ff;
    }
    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff4d2;
      border: 1px solid #efd889;
      color: #8b6500;
      font-weight: 700;
      font-size: 13px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .tile {
      border: 1px solid #f1df9f;
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
    }
    .tile video {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .tile-body {
      padding: 12px;
    }
    .muted {
      color: #6b6179;
      font-size: 14px;
      line-height: 1.6;
    }
    pre {
      white-space: pre-wrap;
      margin: 0;
      line-height: 1.6;
    }
    @media (max-width: 900px) {
      .grid, .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <h1>Bariq AI Video Creator</h1>
      <p class="muted">Clean working version with backend-powered real video fetching.</p>
    </div>

    <div class="grid">
      <div>
        <div class="box">
          <h2>Video Input</h2>

          <div class="form-grid">
            <div>
              <label for="brandName">Brand Name</label>
              <input id="brandName" type="text" placeholder="Example: Bariq AI" />
            </div>

            <div>
              <label for="productName">Product / Service</label>
              <input id="productName" type="text" placeholder="Example: coffee" />
            </div>

            <div>
              <label for="videoType">Video Type</label>
              <select id="videoType">
                <option value="Instagram Reel">Instagram Reel</option>
                <option value="Product Promo">Product Promo</option>
                <option value="Offer Ad">Offer Ad</option>
                <option value="Founder Intro">Founder Intro</option>
              </select>
            </div>

            <div>
              <label for="audience">Audience</label>
              <input id="audience" type="text" placeholder="Example: coffee lovers" />
            </div>

            <div class="full">
              <label for="offer">Offer / Message</label>
              <input id="offer" type="text" placeholder="Example: Premium coffee moments" />
            </div>
          </div>

          <div class="actions">
            <button class="primary" type="button" onclick="generateVideo()">Generate Real Video</button>
            <button class="light" type="button" onclick="clearAll()">Clear</button>
          </div>
        </div>

        <div class="box">
          <h3>Status</h3>
          <div id="statusText" class="muted">Waiting for input...</div>
          <div id="statusBadge" class="badge">Idle</div>
        </div>

        <div class="box">
          <h3>AI Blueprint</h3>
          <pre id="blueprintText">Your blueprint will appear here.</pre>
        </div>
      </div>

      <div>
        <div class="box">
          <h2>Fetched Clips</h2>
          <div id="videoResults" class="video-grid"></div>
        </div>

        <div class="box">
          <h3>Scene Mapping</h3>
          <div id="sceneMapping" class="muted">Scene mapping will appear here.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function setStatus(text, badge) {
      document.getElementById("statusText").textContent = text;
      document.getElementById("statusBadge").textContent = badge;
    }

    function buildQueries(productName, videoType, audience) {
      const base = productName || "business";
      const people = audience || "customers";

      if (videoType === "Founder Intro") {
        return [
          base + " entrepreneur",
          base + " office",
          people + " business"
        ];
      }

      if (videoType === "Offer Ad") {
        return [
          base + " promotion",
          base + " product close up",
          people + " shopping"
        ];
      }

      if (videoType === "Product Promo") {
        return [
          base + " product",
          base + " close up",
          base + " packaging"
        ];
      }

      return [
        base + " social media",
        base + " startup",
        base + " promo"
      ];
    }

    function buildBlueprint() {
      const brandName = document.getElementById("brandName").value || "Your Brand";
      const productName = document.getElementById("productName").value || "Your Product";
      const audience = document.getElementById("audience").value || "your audience";
      const offer = document.getElementById("offer").value || "Special message";

      const text =
`Brand: ${brandName}
Product: ${productName}
Audience: ${audience}

Scene 1: Hook visual
Scene 2: Product focus
Scene 3: Offer/value
Scene 4: CTA

Message: ${offer}`;

      document.getElementById("blueprintText").textContent = text;
    }

    async function fetchVideosFromBackend(query) {
      const response = await fetch("/api/videos?q=" + encodeURIComponent(query));

      if (!response.ok) {
        throw new Error("Backend request failed");
      }

      const data = await response.json();
      return data.videos || [];
    }

    function renderVideos(videos) {
      const container = document.getElementById("videoResults");
      container.innerHTML = "";

      if (!videos.length) {
        container.innerHTML = `
          <div class="tile">
            <div class="tile-body">
              <strong>No clips found</strong>
              <div class="muted">Try a broader keyword.</div>
            </div>
          </div>
        `;
        return;
      }

      videos.forEach((v, index) => {
        const file = v.video_files && v.video_files.length ? v.video_files[0] : null;
        if (!file) return;

        const card = document.createElement("div");
        card.className = "tile";

        card.innerHTML = `
          <video controls autoplay muted loop playsinline>
            <source src="${file.link}" type="video/mp4">
          </video>
          <div class="tile-body">
            <strong>Scene Clip ${index + 1}</strong>
            <div class="muted">Pexels ID: ${v.id || "--"} | Duration: ${v.duration || "--"} sec</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function renderSceneMapping(videos, queries) {
      const box = document.getElementById("sceneMapping");

      if (!videos.length) {
        box.textContent = "No usable clips were found.";
        return;
      }

      let html = "";
      videos.forEach((video, index) => {
        html += `
          <div style="margin-bottom:12px; padding:12px; border:1px solid #f1df9f; border-radius:12px;">
            <strong style="color:#5f2396;">Scene ${index + 1}</strong><br>
            Query: ${queries[index % queries.length]}<br>
            Clip ID: ${video.id || "--"}
          </div>
        `;
      });

      box.innerHTML = html;
    }

    async function generateVideo() {
      const product = document.getElementById("productName").value.trim();
      const videoType = document.getElementById("videoType").value;
      const audience = document.getElementById("audience").value.trim();

      if (!product) {
        setStatus("Please enter Product / Service first.", "Missing Input");
        return;
      }

      setStatus("Generating clips...", "Working");
      buildBlueprint();

      const queries = buildQueries(product, videoType, audience);
      let videos = [];

      try {
        for (const q of queries) {
          const result = await fetchVideosFromBackend(q);
          videos = videos.concat(result.slice(0, 1));
        }

        renderVideos(videos);
        renderSceneMapping(videos, queries);

        if (videos.length) {
          setStatus("Videos ready", "Done");
        } else {
          setStatus("No good clips found.", "No Results");
        }
      } catch (error) {
        console.error(error);
        setStatus("Could not fetch clips from backend.", "Error");
      }
    }

    function clearAll() {
      document.getElementById("brandName").value = "";
      document.getElementById("productName").value = "";
      document.getElementById("videoType").value = "Instagram Reel";
      document.getElementById("audience").value = "";
      document.getElementById("offer").value = "";
      document.getElementById("blueprintText").textContent = "Your blueprint will appear here.";
      document.getElementById("videoResults").innerHTML = "";
      document.getElementById("sceneMapping").textContent = "Scene mapping will appear here.";
      setStatus("Waiting for input...", "Idle");
    }
  </script>
</body>
</html>
