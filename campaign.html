<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bariq AI — Campaign Builder</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial, sans-serif;
background:#FFF3EA;
color:#2f2a4a;
}

.container{
width:min(1300px, calc(100% - 30px));
margin:auto;
}

/* NAVBAR */

.header{
background:#ffffff;
border-bottom:1px solid #f0e6df;
position:sticky;
top:0;
z-index:1000;
}

.nav{
display:flex;
justify-content:space-between;
align-items:center;
height:70px;
}

.brand{
font-size:28px;
font-weight:800;
color:#ff8c70;
}

.menu{
display:flex;
gap:12px;
}

.menu a{
padding:10px 14px;
border-radius:12px;
font-size:14px;
font-weight:700;
color:#6d657f;
text-decoration:none;
}

.menu a:hover{
background:#fff6f2;
}

/* WORKSPACE */

.workspace{
padding:40px 0;
}

/* STEPS */

.steps{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:20px;
}

.step{
background:#FFFCF6;
padding:14px;
border-radius:14px;
font-weight:700;
font-size:14px;
}

/* GRID */

.builder{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* CARDS */

.card{
background:#FFFCF6;
border-radius:18px;
padding:20px;
box-shadow:0 12px 30px rgba(0,0,0,0.04);
}

/* FORM */

.field{
display:flex;
flex-direction:column;
gap:6px;
margin-bottom:14px;
}

.field label{
font-size:13px;
font-weight:700;
}

.field input,
.field textarea,
.field select{
border:1px solid #f0e6df;
padding:12px;
border-radius:12px;
font:inherit;
}

textarea{
min-height:90px;
}

/* BUTTON */

button{
background:#FF9A7A;
border:none;
padding:12px 16px;
border-radius:12px;
color:white;
font-weight:700;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

/* OUTPUT */

.output{
background:white;
border-radius:14px;
padding:14px;
margin-bottom:14px;
min-height:120px;
border:1px solid #f2e7df;
}

.output h4{
margin:0 0 6px;
font-size:16px;
}

</style>
</head>

<body>

<header class="header">
<div class="container nav">

<div class="brand">Bariq AI</div>

<div class="menu">
<a href="index.html">Home</a>
<a href="ai-generator.html">AI Generator</a>
<a href="campaign.html">Campaign</a>
<a href="templates.html">Templates</a>
<a href="payments.html">Payments</a>
<a href="login.html">Login</a>
</div>

</div>
</header>

<section class="workspace">
<div class="container">

<div class="steps">
<div class="step">Step 1 — Brief</div>
<div class="step">Step 2 — Audience</div>
<div class="step">Step 3 — Generate</div>
<div class="step">Step 4 — Launch</div>
</div>

<div class="builder">

<!-- LEFT SIDE -->

<div class="card">

<div class="field">
<label>Business Name</label>
<input id="business">
</div>

<div class="field">
<label>Service</label>
<input id="service">
</div>

<div class="field">
<label>Offer</label>
<input id="offer">
</div>

<div class="field">
<label>City</label>
<input id="city">
</div>

<div class="field">
<label>Audience</label>
<input id="audience">
</div>

<div class="field">
<label>Extra Direction</label>
<textarea id="notes"></textarea>
</div>

<button onclick="generate()">Generate Campaign</button>

</div>

<!-- RIGHT SIDE -->

<div class="card">

<div class="output">
<h4>Meta Ad Copy</h4>
<div id="meta"></div>
</div>

<div class="output">
<h4>Reel Script</h4>
<div id="reel"></div>
</div>

<div class="output">
<h4>WhatsApp Promo</h4>
<div id="whatsapp"></div>
</div>

</div>

</div>

</div>
</section>

<script>

function generate(){

let business=document.getElementById("business").value
let service=document.getElementById("service").value
let offer=document.getElementById("offer").value
let city=document.getElementById("city").value
let audience=document.getElementById("audience").value

document.getElementById("meta").innerText=
`Get ${service} at ${business} with ${offer} in ${city}. Perfect for ${audience}. Limited slots available.`

document.getElementById("reel").innerText=
`Hook: Looking for ${service} in ${city}?  
Scene: Show transformation  
Offer: ${offer}  
CTA: Book today with ${business}`

document.getElementById("whatsapp").innerText=
`Hi! ${business} is offering ${offer} on ${service}. Reply to book today.`

}

</script>

</body>
</html>
