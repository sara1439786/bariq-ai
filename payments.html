<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful | Bariq AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #faf7ff 0%, #fff9ef 50%, #f8f2ff 100%);
      color: #241f31;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #f1df9f;
      border-radius: 28px;
      padding: 38px 30px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(78, 38, 112, 0.1);
    }

    .icon-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 22px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #5f2396 0%, #8a3ffc 60%, #d4af37 130%);
      color: #fff6d9;
      font-size: 38px;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(95, 35, 150, 0.2);
    }

    h1 {
      font-size: 34px;
      color: #5f2396;
      margin-bottom: 12px;
    }

    p {
      color: #5c5369;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .plan-box {
      margin: 24px 0;
      padding: 18px;
      border-radius: 18px;
      background: #fffaf0;
      border: 1px solid #f1df9f;
      text-align: left;
    }

    .plan-line {
      margin-bottom: 8px;
      color: #4c445a;
      line-height: 1.6;
    }

    .plan-line:last-child {
      margin-bottom: 0;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      background: #fff4d2;
      color: #8b6500;
      border: 1px solid #efd889;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .btn {
      border: none;
      padding: 14px 22px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #5f2396 0%, #8a3ffc 60%, #d4af37 130%);
      color: white;
      box-shadow: 0 10px 24px rgba(95, 35, 150, 0.18);
    }

    .btn:hover {
      opacity: 0.96;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">✓</div>
    <div class="badge">Payment Verified</div>
    <h1>Payment Successful</h1>
    <p>Your Bariq AI plan has been activated successfully.</p>
    <p>You can now continue to your premium workspace.</p>

    <div class="plan-box">
      <div class="plan-line" id="successPlan">Plan: Loading...</div>
      <div class="plan-line" id="successPrice">Amount: --</div>
      <div class="plan-line" id="successCredits">Credits: --</div>
    </div>

    <button class="btn" onclick="goDashboard()">Go to Dashboard</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const storedPlan = localStorage.getItem("bariq_selected_plan");

      if (storedPlan) {
        try {
          const plan = JSON.parse(storedPlan);
          document.getElementById("successPlan").innerText = "Plan: " + (plan.name || "Starter");
          document.getElementById("successPrice").innerText = "Amount: " + (plan.price || "₹999/month");
          document.getElementById("successCredits").innerText = "Credits: " + (plan.credits || "50 Credits");
        } catch (e) {
          document.getElementById("successPlan").innerText = "Plan: Activated";
        }
      }
    });

    function goDashboard() {
      window.location.href  = "payment-success.html";
    }
  </script>
</body>
</html>
