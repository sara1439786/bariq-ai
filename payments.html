<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bariq AI Plans</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

body{
font-family: Arial, sans-serif;
background:#f5f7ff;
margin:0;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
}

.title{
text-align:center;
font-size:32px;
color:#4b57ff;
margin-bottom:40px;
}

.plan{
background:white;
padding:25px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
display:flex;
justify-content:space-between;
align-items:center;
}

.plan h3{
margin:0;
font-size:20px;
}

.price{
font-size:22px;
font-weight:bold;
}

button{
background:#4b57ff;
border:none;
color:white;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#3a46e0;
}

</style>
</head>


<body>

<div class="container">

<div class="title">Bariq AI Plans</div>

<div class="plan">
<div>
<h3>Starter</h3>
<div class="price">₹1,999 / month</div>
</div>

<button onclick="buyPlan('Starter',1999)">Buy Plan</button>
</div>


<div class="plan">
<div>
<h3>Growth</h3>
<div class="price">₹4,999 / month</div>
</div>

<button onclick="buyPlan('Growth',4999)">Buy Plan</button>
</div>


<div class="plan">
<div>
<h3>Pro</h3>
<div class="price">₹9,999 / month</div>
</div>

<button onclick="buyPlan('Pro',9999)">Buy Plan</button>
</div>

</div>


<script>

const RAZORPAY_KEY = "rzp_test_XXXXXXXX";   // PUT YOUR TEST KEY HERE


function buyPlan(plan, price){

var options = {
key: RAZORPAY_KEY,
amount: price * 100,
currency: "INR",
name: "Bariq AI",
description: plan + " Plan Subscription",

handler: function (response){

alert("Payment Successful");

localStorage.setItem("bariq_user_plan", plan);
localStorage.setItem("bariq_payment_id", response.razorpay_payment_id);

window.location.href="business-dashboard.html";

},

theme:{
color:"#4b57ff"
}

};

var rzp = new Razorpay(options);
rzp.open();

}

</script>

</body>
</html>
