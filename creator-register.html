<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bariq AI Creator Registration</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@700&display=swap" rel="stylesheet"><style>

body{
font-family:Inter;
margin:0;
background:#faf7ff;
}

header{
display:flex;
justify-content:space-between;
padding:20px 40px;
background:white;
border-bottom:1px solid #eee;
}

.logo{
font-family:Sora;
font-size:28px;
font-weight:800;
background:linear-gradient(90deg,#6c63ff,#ff7ac6,#f5b54c);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.container{
max-width:800px;
margin:auto;
padding:50px;
}

form{
background:white;
padding:30px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ddd;
}

button{
background:linear-gradient(90deg,#ffb347,#ff7ac6);
border:none;
padding:12px 20px;
border-radius:20px;
font-weight:700;
cursor:pointer;
}

</style></head><body><header>
<div class="logo">Bariq AI</div>
</header><div class="container"><h2>Creator Registration</h2><form onsubmit="saveCreator(event)"><input id="name" placeholder="Creator Name" required><input id="instagram" placeholder="Instagram Link"><input id="followers" placeholder="Followers"><input id="niche" placeholder="Niche (Beauty / Food / Fitness)"><input id="price" placeholder="Price per Reel"><input id="city" placeholder="City"><button type="submit">Register Creator</button>

</form></div><script>

function saveCreator(e){

e.preventDefault()

let creators=JSON.parse(localStorage.getItem("creators"))||[]

let creator={
name:document.getElementById("name").value,
instagram:document.getElementById("instagram").value,
followers:document.getElementById("followers").value,
niche:document.getElementById("niche").value,
price:document.getElementById("price").value,
city:document.getElementById("city").value
}

creators.push(creator)

localStorage.setItem("creators",JSON.stringify(creators))

alert("Creator Registered Successfully")

}

</script></body>
</html>
